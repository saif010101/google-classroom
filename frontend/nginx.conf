server {
  listen 80;
  server_name ourclassroom.tech www.ourclassroom.tech;
  return 301 https://$host$request_uri;
}


server {

	listen 443 ssl;
	server_name ourclassroom.tech www.ourclassroom.tech;

	
	ssl_certificate  /etc/letsencrypt/live/ourclassroom.tech/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/ourclassroom.tech/privkey.pem;
	
	location / {
		root /usr/share/nginx/html;
		index index.html;
		try_files $uri $uri/ /index.html;
	}

	location /api {
		proxy_pass http://backend:3000;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
	}
}